name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Jangan pernah mengandalkan secret di CI untuk test; test harus offline.
  PYTHONUNBUFFERED: "1"
  UV_LINK_MODE: copy

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Pasang uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Pasang Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Instal dependensi (dari lockfile)
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
      - name: Info versi
        run: |
          uv run python -V
          uv run python -c "import numpy, pandas, pydantic; print('numpy', numpy.__version__, '| pandas', pandas.__version__, '| pydantic', pydantic.VERSION)"
      - name: Lint (ruff)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check (mypy strict)
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q

  audit:
    name: audit dependensi & cek secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: pip-audit pada requirements.lock
        run: |
          uv venv
          uv pip install pip-audit
          uv run pip-audit -r requirements.lock
      - name: Pastikan tidak ada secret ter-commit
        run: |
          set -e
          if [ -f .env ]; then echo "::error::file .env tidak boleh ada di repo"; exit 1; fi
          if git grep -nE "BINANCE_API_(KEY|SECRET)\s*=\s*[A-Za-z0-9]{20,}" -- ':!*.example' ':!*.md'; then
            echo "::error::kredensial terdeteksi di dalam repo"; exit 1
          fi
          echo "Tidak ada kredensial yang ter-commit."
